name: CD

# Runs only after the CI workflow succeeded for a push (incl. PR merge):
#   develop -> staging
#   main    -> production
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image name, tag and target environment
        id: meta
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          case "$BRANCH" in
            main)    environment=production; channel=latest ;;
            develop) environment=staging;    channel=develop ;;
            *) echo "Branch $BRANCH is not deployable"; exit 1 ;;
          esac
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/intro-devops-api"
            echo "tag=sha-$(git rev-parse --short=7 HEAD)"
            echo "sha=$(git rev-parse HEAD)"
            echo "channel=${channel}"
            echo "environment=${environment}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\` → **${{ steps.meta.outputs.environment }}**" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Staging
    needs: build-and-push
    if: needs.build-and-push.outputs.environment == 'staging'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-vps.yml
    with:
      environment: staging
      tag: ${{ needs.build-and-push.outputs.tag }}
      ref: ${{ needs.build-and-push.outputs.sha }}
    secrets: inherit

  deploy-production:
    name: Production
    needs: build-and-push
    if: needs.build-and-push.outputs.environment == 'production'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-vps.yml
    with:
      environment: production
      tag: ${{ needs.build-and-push.outputs.tag }}
      ref: ${{ needs.build-and-push.outputs.sha }}
    secrets: inherit
