name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Publish test report
        if: always() && matrix.node == 22
        uses: dorny/test-reporter@v2
        with:
          name: Jest results
          path: reports/junit.xml
          reporter: jest-junit
          fail-on-error: true

      - name: Coverage summary
        if: always() && matrix.node == 22
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Coverage", "| Metric | % | Covered |", "|---|---|---|",
                ...["lines","statements","functions","branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build, scan & smoke test
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            intro-devops-app:ci
            intro-devops-app:local
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: intro-devops-app:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Smoke test with docker compose
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          curl -fsS http://localhost:9000/health | tee /dev/stderr | jq -e '.status == "ok"'
          id=$(curl -fsS -X POST http://localhost:9000/api/todos \
                 -H 'Content-Type: application/json' -d '{"title":"ci smoke"}' | jq -r .id)
          curl -fsS -X PUT http://localhost:9000/api/todos/$id \
               -H 'Content-Type: application/json' -d '{"completed":true}' | jq -e '.completed == true'
          curl -fsS -o /dev/null -w '%{http_code}\n' -X DELETE http://localhost:9000/api/todos/$id | grep -q 204
          curl -fsS http://localhost:9000/metrics | grep -q http_request_duration_seconds

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
